version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # JsonSchema.Net 9+ moved to the OSMF EULA license, which is not allowed (see CLAUDE.md section 7).
      - dependency-name: JsonSchema.Net
        versions: [">=9.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
