version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # JsonSchema.Net 9+ moved to the OSMF EULA license, which is not allowed (see CLAUDE.md section 7).
      - dependency-name: JsonSchema.Net
        versions: [">=9.0.0"]
      # ADR 0015: framework-aligned packages have one version per target (net10.0 / net11.0); a major
      # bump would move the net10.0 line to a version that does not support .NET 10. Runtime majors go through an ADR.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Options"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
        update-types: ["version-update:semver-major"]
      # EF Core stays on 10.x until Npgsql.EntityFrameworkCore.PostgreSQL 11 is released (ADR 0015).
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A .NET runtime major change is a decision (ADR 0015), not a dependency bump.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
