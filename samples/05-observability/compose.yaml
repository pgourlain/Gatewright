# Gateway -> OpenTelemetry Collector -> Prometheus -> Grafana (dashboard from deploy/observability).
services:
  orders:
    image: gatewright/sample-orders:dev
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PROJECT: samples/backend-orders
        ASSEMBLY: backend-orders

  gateway:
    image: gatewright/host:dev
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["--Gateway:Mode=all", "--Gateway:ConfigFile=/config/gateway.json"]
    environment:
      Telemetry__Otlp__Endpoint: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      Telemetry__Usage__Enabled: "true"
      Telemetry__Usage__FlushSeconds: "10"
    volumes:
      - ./gateway.json:/config/gateway.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - orders
      - otel-collector

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro

  prometheus:
    image: docker.io/prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/observability/grafana-gatewright.json:/var/lib/grafana/dashboards/gatewright.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
