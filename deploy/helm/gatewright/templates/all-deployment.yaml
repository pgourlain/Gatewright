{{- if eq .Values.gateway.mode "all" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatewright.fullname" . }}-all
  labels:
    {{- include "gatewright.labels" . | nindent 4 }}
    app.kubernetes.io/component: all
spec:
  # Single replica: the control plane's default SQLite provider is not safe for concurrent writers.
  # Scale with gateway.mode=separate instead (independent control plane and data plane Deployments).
  replicas: 1
  selector:
    matchLabels:
      {{- include "gatewright.selectorLabels" (merge (dict "component" "all") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gatewright.labels" . | nindent 8 }}
        app.kubernetes.io/component: all
        {{- if .Values.azureWorkloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gatewright.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $init := include "gatewright.waitForDevPostgresInitContainer" . }}
      {{- if trim $init }}
      initContainers:
        {{- $init | nindent 8 }}
      {{- end }}
      containers:
        - name: gatewright
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Gateway__Mode
              value: "All"
            - name: Gateway__ConfigSource
              value: "Database"
            {{- include "gatewright.commonEnv" . | nindent 12 }}
            {{- include "gatewright.controlPlaneEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: dataprotection-keys
              mountPath: /home/app/.aspnet
            {{- if not (or .Values.postgres.connectionString .Values.postgres.dev.enabled) }}
            - name: data
              mountPath: /data
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.all.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dataprotection-keys
          emptyDir: {}
        {{- if not (or .Values.postgres.connectionString .Values.postgres.dev.enabled) }}
        - name: data
          {{- if .Values.all.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gatewright.fullname" . }}-all-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
