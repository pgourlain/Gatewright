{{- if and (eq .Values.gateway.mode "all") (not (or .Values.postgres.connectionString .Values.postgres.dev.enabled)) .Values.all.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gatewright.fullname" . }}-all-data
  labels:
    {{- include "gatewright.labels" . | nindent 4 }}
    app.kubernetes.io/component: all
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.all.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.all.persistence.size }}
{{- end }}
