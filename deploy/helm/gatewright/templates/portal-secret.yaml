{{- if and .Values.portal.enabled .Values.portal.auth.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatewright.fullname" . }}-portal-auth
  labels:
    {{- include "gatewright.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal
type: Opaque
data:
  clientSecret: {{ .Values.portal.auth.clientSecret | b64enc }}
{{- end }}
