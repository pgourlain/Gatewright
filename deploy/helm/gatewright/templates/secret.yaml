apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatewright.fullname" . }}-distribution
  labels:
    {{- include "gatewright.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "gatewright.distributionToken" . | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatewright.fullname" . }}-secrets
  labels:
    {{- include "gatewright.labels" . | nindent 4 }}
type: Opaque
data:
  diagnosticsToken: {{ .Values.gateway.diagnosticsToken | b64enc }}
  redisConnectionString: {{ (include "gatewright.redisConnectionString" .) | b64enc }}
  controlPlaneConnectionString: {{ (include "gatewright.postgresConnectionString" . | default .Values.controlPlane.connectionString) | b64enc }}
