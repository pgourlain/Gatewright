{{- if and (eq .Values.gateway.mode "separate") .Values.dataPlane.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gatewright.fullname" . }}-dataplane
  labels:
    {{- include "gatewright.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataplane
spec:
  minAvailable: {{ .Values.dataPlane.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "gatewright.selectorLabels" (merge (dict "component" "dataplane") .) | nindent 6 }}
{{- end }}
